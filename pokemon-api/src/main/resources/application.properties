spring.application.name=pokemon-api

# Base de datos embebida H2 en memoria: no requiere Docker ni un servidor de base de datos aparte.
# Los datos se pierden al reiniciar Tomcat (es justo lo que buscamos para una practica sencilla).
spring.datasource.url=jdbc:h2:mem:pokemondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2, util para ver la tabla desde el navegador.
# Desplegada en Tomcat externo (contexto "pokemon-api"), la consola queda en:
#   http://<IP>:8080/pokemon-api/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
