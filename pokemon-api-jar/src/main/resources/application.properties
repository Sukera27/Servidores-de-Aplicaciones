spring.application.name=pokemon-api-jar

# Puerto del Tomcat embebido. El 8080 lo usa el Tomcat instalado en la VM (Tema 2),
# asi que esta API escucha en el 8081 y pueden convivir las dos a la vez.
server.port=8081

# Base de datos embebida H2 en memoria: no requiere Docker ni un servidor de base de datos aparte.
# Los datos se pierden al reiniciar la aplicacion (es justo lo que buscamos para una practica sencilla).
spring.datasource.url=jdbc:h2:mem:pokemondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2, util para ver la tabla desde el navegador.
# Al ser un jar con Tomcat embebido NO hay contexto "pokemon-api", la consola queda en:
#   http://<IP>:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
